services:
  # ─── Backend (NestJS) ──────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
      args:
        BACKEND_PORT: ${BACKEND_PORT:-3000}
    container_name: talent-bridge-backend
    ports:
      - '${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}'
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-3000}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5174}
      MONGODB_URI: mongodb://admin:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/talent-bridge?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      WATSONX_URL: ${WATSONX_URL}
      WATSONX_PROJECT_ID: ${WATSONX_PROJECT_ID}
      WATSONX_API_KEY: ${WATSONX_API_KEY}
      WATSONX_MODEL_ID: ${WATSONX_MODEL_ID}
      COS_ENDPOINT: ${COS_ENDPOINT}
      COS_API_KEY: ${COS_API_KEY}
      COS_INSTANCE_CRN: ${COS_INSTANCE_CRN}
      COS_BUCKET_CVS: ${COS_BUCKET_CVS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    volumes:
      - ./apps/backend/src:/app/src
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:${BACKEND_PORT:-3000}/api/v1/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - talent-bridge-net
    restart: unless-stopped

  # ─── Frontend (React + Vite) ───────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
      args:
        FRONTEND_PORT: ${FRONTEND_PORT:-5174}
    container_name: talent-bridge-frontend
    ports:
      - '${FRONTEND_PORT:-5174}:${FRONTEND_PORT:-5174}'
    environment:
      VITE_PORT: ${FRONTEND_PORT:-5174}
      VITE_BACKEND_PORT: ${BACKEND_PORT:-3000}
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}
      VITE_APP_ENV: development
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      # Read-only: habilita el alias @ibm-talent-bridge/shared-types (tsconfig
      # paths + Vite alias → ../../packages/shared-types/src/index.ts), que
      # resuelve relativo a /app/apps/frontend dentro del contenedor.
      - ./packages:/app/packages:ro
    depends_on:
      - backend
    networks:
      - talent-bridge-net
    restart: unless-stopped

  # ─── MongoDB ───────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: talent-bridge-mongodb
    ports:
      - '${MONGO_PORT:-27017}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: talent-bridge
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      # CMD-SHELL con comillas: la forma CMD con paréntesis rompe /bin/sh en podman-compose
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand(''ping'').ok" || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - talent-bridge-net
    restart: unless-stopped

  # ─── Mongo Express (UI local) ──────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: talent-bridge-mongo-ui
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://admin:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - talent-bridge-net
    profiles:
      - tools

volumes:
  mongodb_data:

networks:
  talent-bridge-net:
    driver: bridge
