# Docker Compose para tests de integración
# Uso: docker-compose -f docker-compose.test.yml up --abort-on-container-exit

services:
  backend-test:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: talent-bridge-backend-test
    command: npm run test:e2e
    environment:
      NODE_ENV: test
      PORT: 3001
      MONGODB_URI: mongodb://admin:${MONGO_INITDB_ROOT_PASSWORD_TEST}@mongodb-test:27017/talent-bridge-test?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD_TEST}@redis-test:6379/1
      JWT_SECRET: test_secret_key_for_ci_only_32chars
      JWT_EXPIRATION: 1h
      JWT_REFRESH_EXPIRATION: 7d
    depends_on:
      mongodb-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - talent-bridge-test-net

  mongodb-test:
    image: mongo:7.0
    container_name: talent-bridge-mongodb-test
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD_TEST}
      MONGO_INITDB_DATABASE: talent-bridge-test
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - talent-bridge-test-net

  redis-test:
    image: redis:7.2-alpine
    container_name: talent-bridge-redis-test
    command: redis-server --requirepass ${REDIS_PASSWORD_TEST}
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD_TEST}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - talent-bridge-test-net

networks:
  talent-bridge-test-net:
    driver: bridge
