name: CI — Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/frontend/**'
      - 'packages/shared-types/**'
      - 'packages/shared-utils/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/frontend/**'
      - 'packages/shared-types/**'
      - 'packages/shared-utils/**'

jobs:
  quality-gate:
    name: Quality (line limits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Informational only while Etapa 2 (DT-002) is open: 5 critical violations
      # (DT-002...DT-006) are known debt tracked in good-practices/DEBT_TECH.md.
      # Switch to `--strict` and drop continue-on-error once Etapa 2 closes DT-002.
      - name: Validate line-limit quality gate
        run: node good-practices/validate-quality.mjs
        continue-on-error: true

  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/frontend

      - name: Lint
        run: npm run lint
        working-directory: apps/frontend

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: apps/frontend

  build:
    name: Build Static Site
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Build
        run: npm run build
        working-directory: apps/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          VITE_APP_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/
