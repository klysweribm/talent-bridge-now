services:
  # ─── Backend (NestJS) ──────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
      args:
        BACKEND_PORT: ${BACKEND_PORT:-3000}
    container_name: talent-bridge-backend
    ports:
      - '${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}'
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-3000}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5174}
      MONGODB_URI: mongodb://admin:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/talent-bridge?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      WATSON_NLU_URL: ${WATSON_NLU_URL}
      WATSON_NLU_API_KEY: ${WATSON_NLU_API_KEY}
      WATSON_NLU_VERSION: ${WATSON_NLU_VERSION}
      COS_ENDPOINT: ${COS_ENDPOINT}
      COS_API_KEY: ${COS_API_KEY}
      COS_INSTANCE_CRN: ${COS_INSTANCE_CRN}
      COS_BUCKET_CVS: ${COS_BUCKET_CVS}
      EVENT_NOTIFICATIONS_GUID: ${EVENT_NOTIFICATIONS_GUID}
      EVENT_NOTIFICATIONS_API_KEY: ${EVENT_NOTIFICATIONS_API_KEY}
      EVENT_NOTIFICATIONS_URL: ${EVENT_NOTIFICATIONS_URL}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    volumes:
      - ./apps/backend/src:/app/src
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:${BACKEND_PORT:-3000}/api/v1/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talent-bridge-net
    restart: unless-stopped

  # ─── Frontend (React + Vite) ───────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
      args:
        FRONTEND_PORT: ${FRONTEND_PORT:-5174}
    container_name: talent-bridge-frontend
    ports:
      - '${FRONTEND_PORT:-5174}:${FRONTEND_PORT:-5174}'
    environment:
      VITE_PORT: ${FRONTEND_PORT:-5174}
      VITE_BACKEND_PORT: ${BACKEND_PORT:-3000}
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}
      VITE_APP_ENV: development
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      # Read-only: habilita el alias @ibm-talent-bridge/shared-types (tsconfig
      # paths + Vite alias → ../../packages/shared-types/src/index.ts), que
      # resuelve relativo a /app/apps/frontend dentro del contenedor.
      - ./packages:/app/packages:ro
    depends_on:
      - backend
    networks:
      - talent-bridge-net
    restart: unless-stopped

  # ─── MongoDB ───────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: talent-bridge-mongodb
    ports:
      - '${MONGO_PORT:-27017}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: talent-bridge
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')", '--quiet']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - talent-bridge-net
    restart: unless-stopped

  # ─── Redis ─────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: talent-bridge-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talent-bridge-net
    restart: unless-stopped

  # ─── Mongo Express (UI local) ──────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: talent-bridge-mongo-ui
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://admin:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - talent-bridge-net
    profiles:
      - tools

volumes:
  mongodb_data:
  redis_data:

networks:
  talent-bridge-net:
    driver: bridge
