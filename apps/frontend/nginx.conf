# Plantilla procesada por el entrypoint de nginx-unprivileged (envsubst sobre
# /etc/nginx/templates/*.template → /etc/nginx/conf.d/*.conf), sustituyendo
# solo variables definidas en el entorno del contenedor — ej. ${API_UPSTREAM}.
# Ver docs/architecture/README.md (ADR-006) y apps/frontend/Dockerfile.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip — texto/JS/CSS, no binarios ya comprimidos
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Assets con hash en el nombre (Vite) — cache larga e inmutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy de /api hacia tb-api — tráfico interno del proyecto Code Engine,
    # mismo dominio para el navegador, sin CORS.
    location /api/ {
        proxy_pass ${API_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — cualquier ruta del router de React sirve index.html
    location / {
        try_files $uri /index.html;
    }
}
